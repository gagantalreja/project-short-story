<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Short Story</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

  :root {
    --wine: #7c2d3e;
    --wine-deep: #5a1a2a;
    --wine-light: #a94458;
    --gold: #c9a96e;
    --gold-light: #e8d5a8;
    --cream: #faf7f2;
    --cream-dark: #f0ebe3;
    --ink: #2a1f1f;
    --ink-light: #5c4a4a;
    --muted: #8e7b7b;
    --border: #e8ddd0;
    --card-bg: #ffffff;
    --accent-blue: #3b5998;
    --accent-green: #2d7d5f;
    --accent-red: #c0392b;
    --accent-amber: #b7791f;
    --accent-pink: #8e3a5e;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Hero ── */
  .hero {
    position: relative;
    background: linear-gradient(135deg, #3a0f1c 0%, #5a1a2a 25%, #4a1832 50%, #2e1528 75%, #1a0e1e 100%);
    background-size: 300% 300%;
    animation: heroShift 12s ease-in-out infinite;
    color: #fff;
    padding: 4rem 1.5rem 3rem;
    text-align: center;
    overflow: hidden;
  }

  @keyframes heroShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 600px 400px at 15% 40%, rgba(201,169,110,0.2) 0%, transparent 70%),
      radial-gradient(ellipse 500px 500px at 85% 20%, rgba(169,68,88,0.3) 0%, transparent 60%),
      radial-gradient(ellipse 400px 350px at 50% 90%, rgba(201,169,110,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 300px 300px at 70% 60%, rgba(120,50,80,0.2) 0%, transparent 60%);
    pointer-events: none;
    animation: glowPulse 8s ease-in-out infinite alternate;
  }

  @keyframes glowPulse {
    0% { opacity: 0.8; }
    100% { opacity: 1; }
  }

  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  .hero-ornament {
    position: absolute;
    opacity: 0.06;
    font-size: 2.5rem;
    animation: float 6s ease-in-out infinite;
    pointer-events: none;
    user-select: none;
  }

  .hero-ornament:nth-child(1) { top: 12%; left: 8%; animation-delay: 0s; }
  .hero-ornament:nth-child(2) { top: 60%; left: 5%; animation-delay: 1.5s; font-size: 2rem; }
  .hero-ornament:nth-child(3) { top: 20%; right: 10%; animation-delay: 3s; font-size: 1.8rem; }
  .hero-ornament:nth-child(4) { top: 65%; right: 8%; animation-delay: 0.8s; font-size: 2.2rem; }
  .hero-ornament:nth-child(5) { top: 35%; left: 15%; animation-delay: 2.2s; font-size: 1.5rem; }
  .hero-ornament:nth-child(6) { top: 45%; right: 15%; animation-delay: 4s; font-size: 1.6rem; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(3deg); }
  }

  .hero-inner {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: 0 auto;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--gold);
    border: 1px solid rgba(201,169,110,0.3);
    padding: 6px 14px;
    border-radius: 100px;
    margin-bottom: 1.5rem;
  }

  .hero h1 {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 3rem;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, #fff 0%, var(--gold-light) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-desc {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 0.92rem;
    color: rgba(255,255,255,0.6);
    line-height: 2;
    margin-bottom: 2rem;
    font-weight: 400;
  }

  /* ── Search Area ── */
  .search-area {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .search-box {
    flex: 1;
    position: relative;
  }

  .search-box svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    stroke: rgba(255,255,255,0.35);
    transition: stroke 0.2s;
  }

  #search {
    width: 100%;
    padding: 14px 16px 14px 48px;
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-sm);
    font-size: 0.95rem;
    font-family: 'Inter', sans-serif;
    background: rgba(255,255,255,0.07);
    color: #fff;
    outline: none;
    backdrop-filter: blur(12px);
    transition: all 0.25s;
  }

  #search::placeholder { color: rgba(255,255,255,0.3); }

  #search:focus {
    background: rgba(255,255,255,0.12);
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,169,110,0.15);
  }

  #search:focus ~ svg { stroke: var(--gold); }

  .script-toggle {
    display: flex;
    border-radius: var(--radius-sm);
    overflow: hidden;
    border: 1.5px solid rgba(255,255,255,0.12);
    flex-shrink: 0;
  }

  .script-toggle button {
    padding: 13px 16px;
    border: none;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
    line-height: 1;
  }

  .script-toggle button.active {
    background: var(--gold);
    color: var(--wine-deep);
  }

  .script-toggle button:not(.active) {
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.4);
  }

  .script-toggle button:not(.active):hover {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.8);
  }

  /* ── Stats Strip ── */
  .stats-strip {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
  }

  .stats-inner {
    max-width: 1120px;
    margin: 0 auto;
    display: flex;
    gap: 2rem;
    align-items: center;
    justify-content: center;
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .stat-num {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--wine);
    font-variant-numeric: tabular-nums;
  }

  .stat-label {
    font-weight: 500;
  }

  .stat-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--border);
  }

  /* ── Filter Bar ── */
  .filter-bar {
    max-width: 1120px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-label {
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-right: 4px;
  }

  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 14px;
    border-radius: 100px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    font-size: 0.78rem;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    color: var(--ink-light);
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .filter-chip:hover {
    border-color: var(--wine-light);
    color: var(--wine);
  }

  .filter-chip.active {
    background: var(--wine);
    color: #fff;
    border-color: var(--wine);
  }

  .filter-chip svg {
    width: 13px;
    height: 13px;
  }

  /* ── Main Content ── */
  .container {
    max-width: 1120px;
    margin: 0 auto;
    padding: 1.5rem 1.5rem 3rem;
  }

  .results-info {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 1rem;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  /* ── Story Grid ── */
  .story-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
  }

  .story-card {
    display: flex;
    gap: 14px;
    padding: 1.2rem 1.3rem;
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    cursor: default;
    animation: cardIn 0.35s cubic-bezier(0.4, 0, 0.2, 1) both;
  }

  @keyframes cardIn {
    from {
      opacity: 0;
      transform: translateY(12px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .story-card:hover {
    border-color: var(--gold);
    box-shadow:
      0 4px 24px rgba(124,45,62,0.06),
      0 1px 4px rgba(0,0,0,0.04);
    transform: translateY(-2px);
  }

  .story-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 16px;
    bottom: 16px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: var(--gold);
    opacity: 0;
    transition: opacity 0.25s;
  }

  .story-card:hover::before {
    opacity: 1;
  }

  /* Writer initial avatar */
  .writer-avatar {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .story-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .story-number {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 0.68rem;
    color: var(--border);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .story-title {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.5;
    margin-bottom: 2px;
  }

  .story-title a {
    color: var(--ink);
    text-decoration: none;
    transition: color 0.2s;
  }

  .story-title a:hover {
    color: var(--wine);
  }

  .story-writer {
    font-size: 0.82rem;
    color: var(--muted);
    font-weight: 400;
    margin-bottom: 8px;
  }

  .no-link {
    display: inline-block;
    font-size: 0.65rem;
    color: var(--muted);
    margin-left: 6px;
    vertical-align: middle;
    font-style: italic;
  }

  .story-tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: auto;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 6px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .tag-lang {
    background: #eef0f8;
    color: var(--accent-blue);
  }

  .tag-video {
    background: #fef2f2;
    color: var(--accent-red);
  }

  .tag-audio {
    background: #ecfdf5;
    color: var(--accent-green);
  }

  .tag-original {
    background: #fef9ee;
    color: var(--accent-amber);
  }

  .tag-magazine {
    background: #fdf2f8;
    color: var(--accent-pink);
  }

  .tag svg {
    width: 11px;
    height: 11px;
    flex-shrink: 0;
  }

  /* ── Pagination ── */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 2.5rem;
    flex-wrap: wrap;
  }

  .pagination button {
    padding: 9px 16px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }

  .pagination button:hover:not(:disabled) {
    background: var(--wine);
    color: #fff;
    border-color: var(--wine);
  }

  .pagination button:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .pagination button.active {
    background: var(--wine);
    color: #fff;
    border-color: var(--wine);
  }

  .pagination .page-btn {
    min-width: 42px;
    text-align: center;
  }

  /* ── Empty State ── */
  .empty-state {
    text-align: center;
    padding: 5rem 1rem;
    color: var(--muted);
    grid-column: 1 / -1;
  }

  .empty-state .empty-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    opacity: 0.4;
  }

  .empty-state p {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 1.2rem;
    margin-bottom: 0.4rem;
    color: var(--ink-light);
  }

  .empty-state span {
    font-size: 0.85rem;
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 2.5rem 1rem;
    font-size: 0.8rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    max-width: 1120px;
    margin: 0 auto;
  }

  footer a {
    color: var(--wine);
    text-decoration: none;
    font-weight: 600;
  }

  footer a:hover {
    text-decoration: underline;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    .hero { padding: 2.5rem 1rem 2rem; }
    .hero h1 { font-size: 2rem; }
    .hero-desc { font-size: 0.85rem; line-height: 1.9; }
    .container { padding: 1.2rem 1rem 2rem; }
    .story-list { grid-template-columns: 1fr; }
    .story-card { padding: 1rem; gap: 10px; }
    .story-title { font-size: 1rem; }
    .writer-avatar { width: 34px; height: 34px; font-size: 0.95rem; }
    .stats-inner { gap: 1rem; }
    .stat-num { font-size: 1.1rem; }
    .filter-bar { padding: 1rem 1rem 0; }
  }
</style>
</head>
<body>

<div class="hero">
  <span class="hero-ornament">📖</span>
  <span class="hero-ornament">✍</span>
  <span class="hero-ornament">📚</span>
  <span class="hero-ornament">📜</span>
  <span class="hero-ornament">🪶</span>

  <div class="hero-inner">
    <div class="hero-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>

<div class="stats-strip">

    </div>
    <span class="stat-dot"></span>
    <div class="stat-item">
      <span class="stat-num" id="stat-writers">0</span>
      <span class="stat-label">Writers</span>
    </div>
    <span class="stat-dot"></span>
    <div class="stat-item">

</div>

<div class="filter-bar" id="filter-bar">
  <span class="filter-label">Filter</span>
  <button class="filter-chip active" data-filter="all">All</button>
  <button class="filter-chip" data-filter="hindi">Hindi</button>
  <button class="filter-chip" data-filter="english">English</button>

    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>

    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg>

<div class="container">
  <div class="results-info" id="results-info"></div>
  <div class="story-list" id="story-list"></div>

<script src="stories.js"></script>
<script>
const PER_PAGE = 12;
let currentPage = 1;
let filteredEntries = [];
let useDevanagari = true;
let activeFilter = 'all';

const AVATAR_COLORS = [
  '#7c2d3e', '#3b5998', '#2d7d5f', '#b7791f',
  '#6b46c1', '#c0392b', '#0e7490', '#8e3a5e',
  '#4a5568', '#2c5282', '#744210', '#276749'
];

const devCache = new Map([
  ['Renu', 'रेणु'],
  ['Jaiswal', 'जायसवाल'],
  ['Collectory', 'कलक्टरी'],
  ['Toba', 'टोबा'],
  ['Tek', 'टेक'],
  ['Bakhshish', 'बख्शिश']
]);

function getAvatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

function getInitial(name, showDev) {
  if (showDev) {
    const dev = devCache.get(name);
    if (dev) return dev.charAt(0);
  }
  return name.charAt(0).toUpperCase();
}

function computeStats() {
  let stories = 0;
  const writers = DATA.length;
  const langs = new Set();
  for (const w of DATA) {
    stories += w.stories.length;
    for (const s of w.stories) langs.add(s.language);
  }
  document.getElementById('stat-stories').textContent = stories;
  document.getElementById('stat-writers').textContent = writers;
  document.getElementById('stat-languages').textContent = langs.size;
}

async function transliterate(text) {
  if (devCache.has(text)) return devCache.get(text);
  try {
    const words = text.split(/\s+/);
    const results = await Promise.all(words.map(async word => {
      if (devCache.has(word)) return devCache.get(word);
      if (/^[A-Z0-9]+$/.test(word)) { devCache.set(word, word); return word; }
      const url = `https://inputtools.google.com/request?text=${encodeURIComponent(word)}&itc=hi-t-i0-und&num=1`;
      const resp = await fetch(url);
      const data = await resp.json();
      const dev = (data[0] === 'SUCCESS' && data[1][0][1][0]) || word;
      devCache.set(word, dev);
      return dev;
    }));
    const full = results.join(' ');
    devCache.set(text, full);
    return full;
  } catch {
    return text;
  }
}

async function prefetchDevanagari() {
  const texts = new Set();
  for (const w of DATA) {
    texts.add(w.writer);
    for (const s of w.stories) texts.add(s.story);
  }
  await Promise.all([...texts].map(t => transliterate(t)));
}

function getMediaType(link) {
  if (!link) return null;
  if (link.includes('youtube.com') || link.includes('youtu.be')) return 'video';
  if (link.includes('spotify.com')) return 'audio';
  return null;
}

function getDev(text) {
  return devCache.get(text) || text;
}

function flattenData(query) {
  const q = (query || '').toLowerCase().trim();
  const entries = [];
  for (const w of DATA) {
    const writerDev = getDev(w.writer);
    const writerMatch = !q || w.writer.toLowerCase().includes(q) || writerDev.includes(q);
    for (const s of w.stories) {
      const storyDev = getDev(s.story);
      const storyMatch = !q || s.story.toLowerCase().includes(q) || storyDev.includes(q);
      if (!writerMatch && !storyMatch) continue;

      const media = getMediaType(s.link);

      if (activeFilter !== 'all') {
        if (activeFilter === 'hindi' && s.language !== 'Hindi') continue;
        if (activeFilter === 'english' && s.language !== 'English') continue;
        if (activeFilter === 'video' && media !== 'video') continue;
        if (activeFilter === 'audio' && media !== 'audio') continue;
        if (activeFilter === 'translated' && !s.original) continue;
        if (activeFilter === 'magazine' && !s.magazine) continue;
      }

      const showDev = useDevanagari && s.language === 'Hindi';
      entries.push({
        writer: showDev ? writerDev : w.writer,
        writerRaw: w.writer,
        story: showDev ? storyDev : s.story,
        link: s.link,
        language: s.language,
        media: media,
        original: s.original || null,
        magazine: s.magazine || null,
        showDev: showDev
      });
    }
  }
  entries.sort((a, b) => a.writerRaw.localeCompare(b.writerRaw));
  return entries;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render() {
  const list = document.getElementById('story-list');
  const info = document.getElementById('results-info');
  const totalPages = Math.max(1, Math.ceil(filteredEntries.length / PER_PAGE));

  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PER_PAGE;
  const pageEntries = filteredEntries.slice(start, start + PER_PAGE);

  if (pageEntries.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📖</div><p>कोई कहानी नहीं मिली</p><span>No stories found for this search</span></div>';
    info.textContent = '';
  } else {
    info.textContent = `Showing ${start + 1}–${start + pageEntries.length} of ${filteredEntries.length} stories`;
    list.innerHTML = pageEntries.map((entry, i) => {
      const num = start + i + 1;
      const delay = i * 0.04;
      const title = entry.link
        ? `<a href="${escapeHtml(entry.link)}" target="_blank" rel="noopener">${escapeHtml(entry.story)}</a>`
        : `${escapeHtml(entry.story)}<span class="no-link">link unavailable</span>`;

      const avatarColor = getAvatarColor(entry.writerRaw);
      const initial = getInitial(entry.writerRaw, entry.showDev);

      let tags = `<span class="tag tag-lang">${escapeHtml(entry.language)}</span>`;
      if (entry.media === 'video') {
        tags += `<span class="tag tag-video"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Video</span>`;
      } else if (entry.media === 'audio') {
        tags += `<span class="tag tag-audio"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/></svg>Audio</span>`;
      }
      if (entry.original) {
        const parts = entry.original.split(' by ');
        tags += `<span class="tag tag-original">${escapeHtml(parts[0])}</span>`;
        if (parts[1]) tags += `<span class="tag tag-original">Tr. ${escapeHtml(parts[1])}</span>`;
      }
      if (entry.magazine) {
        tags += `<span class="tag tag-magazine" title="Sourced from ${escapeHtml(entry.magazine)}">${escapeHtml(entry.magazine)}</span>`;
      }

      return `<div class="story-card" style="animation-delay:${delay}s">
        <div class="writer-avatar" style="background:${avatarColor}">${escapeHtml(initial)}</div>
        <div class="story-body">
          <span class="story-number">#${num}</span>
          <div class="story-title">${title}</div>
          <div class="story-writer">${escapeHtml(entry.writer)}</div>
          <div class="story-tags">${tags}</div>
        </div>
      </div>`;
    }).join('');
  }

  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const pag = document.getElementById('pagination');
  if (totalPages <= 1) { pag.innerHTML = ''; return; }

  let html = `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goTo(${currentPage - 1})">← Prev</button>`;

  const maxVisible = 7;
  let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
  let endPage = Math.min(totalPages, startPage + maxVisible - 1);
  if (endPage - startPage < maxVisible - 1) startPage = Math.max(1, endPage - maxVisible + 1);

  if (startPage > 1) {
    html += `<button class="page-btn" onclick="goTo(1)">1</button>`;
    if (startPage > 2) html += `<span style="color:#8e7b7b;padding:0 4px">…</span>`;
  }

  for (let p = startPage; p <= endPage; p++) {
    html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="goTo(${p})">${p}</button>`;
  }

  if (endPage < totalPages) {
    if (endPage < totalPages - 1) html += `<span style="color:#8e7b7b;padding:0 4px">…</span>`;
    html += `<button class="page-btn" onclick="goTo(${totalPages})">${totalPages}</button>`;
  }

  html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goTo(${currentPage + 1})">Next →</button>`;
  pag.innerHTML = html;
}

function goTo(page) {
  currentPage = page;
  render();
  window.scrollTo({ top: document.querySelector('.container').offsetTop - 20, behavior: 'smooth' });
}

function refreshList() {
  filteredEntries = flattenData(document.getElementById('search').value);
  currentPage = 1;
  render();
}

document.getElementById('search').addEventListener('input', refreshList);

document.getElementById('script-toggle').addEventListener('click', function(e) {
  const btn = e.target.closest('button');
  if (!btn || btn.classList.contains('active')) return;
  this.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  useDevanagari = btn.dataset.script === 'devanagari';
  document.getElementById('page-footer').innerHTML = useDevanagari
    ? '<a href="https://x.com/talrejajeee" target="_blank" rel="noopener">@talrejajeee</a> की तरफ़ से साहित्य अनुरागियों के लिए एक छोटी सी भेंट ❤️'
    : 'Created with ❤️ by <a href="https://x.com/talrejajeee" target="_blank" rel="noopener">@talrejajeee</a>';
  refreshList();
});

document.getElementById('filter-bar').addEventListener('click', function(e) {
  const chip = e.target.closest('.filter-chip');
  if (!chip) return;
  this.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeFilter = chip.dataset.filter;
  refreshList();
});

computeStats();
filteredEntries = flattenData('');
render();
prefetchDevanagari().then(() => {
  refreshList();
});
</script>
